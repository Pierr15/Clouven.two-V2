<!doctype html>
<html lang="id">
  <head>
    <script src="/assets/js/theme.js?v=avatar-source-5"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Gateway · Ruang Kelas</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/app.css?v=startup-transition-3" />
    <link rel="stylesheet" href="/assets/css/theme.css?v=avatar-source-5" />
    <link rel="icon" href="/assets/images/favicon.svg?v=c2-1" type="image/svg+xml" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module" src="/assets/js/pages/login.js?v=startup-transition-3"></script>
  <script type="module" src="/assets/js/form-controls.js?v=forms-12"></script><link rel="stylesheet" href="/assets/css/loading.css?v=startup-transition-3" />
</head>
  <body data-login-mode="admin">
    <script>
      try {
        if (localStorage.getItem("clouven-sidebar-collapsed") === "1") {
          document.documentElement.classList.add("sidebar-precollapsed");
        }
      } catch {}
    </script>
    <div class="page-noise"></div>
    <main class="login-page">
      <section class="login-visual">
        <p class="eyebrow" style="color: #ffc857">gateway pengelola</p>
        <h1>Kelola data, <em>tanpa ribut.</em></h1>
        <p>
          Class Officer, Teacher, dan Developer masuk dari pintu ini. Hak akses
          tetap diverifikasi di server dan Supabase RLS.
        </p>
      </section>
      <section class="login-panel">
        <div class="login-card">
          <p class="eyebrow">admin gateway</p>
          <h2>Area pengelola.</h2>
          <p>
            Student tidak dapat melewati gateway ini walaupun mengetahui
            URL-nya.
          </p>
          <form class="login-form" id="loginForm">
            <div class="form-field">
              <label for="field-1">Username / NIS</label><input name="username" autocomplete="username" required / id="field-1">
            </div>
            <div class="form-field">
              <label for="field-2">Password</label><input
                name="password"
                type="password"
                autocomplete="current-password"
                required
              / id="field-2">
            </div>
            <button class="button button-dark" type="submit">
              Masuk ke Admin →
            </button>
          </form>
          <a class="login-back" href="/">← Kembali ke website</a>
        </div>
      </section>
    </main>
  </body>
</html>
