name: Clouven Drive tests

on:
  pull_request:
    paths:
      - "api/_lib/clouvenDrive*.js"
      - "api/clouven-drive/**"
      - "api/_lib/clouvenDriveUpload.js"
      - "server/api-handlers/clouven-drive/**"
      - "assets/js/pages/clouven-drive.js"
      - "assets/css/clouven-drive.css"
      - "clouven-drive/index.html"
      - "supabase/migrations/**"
      - "tests/clouven-drive-*.mjs"
      - "tests/supabase-migration-layout.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/clouven-drive-tests.yml"
  push:
    branches:
      - main
      - feat/clouven-drive-foundation
    paths:
      - "api/_lib/clouvenDrive*.js"
      - "api/clouven-drive/**"
      - "server/api-handlers/clouven-drive/**"
      - "assets/js/pages/clouven-drive.js"
      - "assets/css/clouven-drive.css"
      - "clouven-drive/index.html"
      - "supabase/migrations/**"
      - "tests/clouven-drive-*.mjs"
      - "tests/supabase-migration-layout.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/clouven-drive-tests.yml"

permissions:
  contents: read

concurrency:
  group: clouven-drive-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drive-tests:
    name: Drive unit and isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Supabase migration layout
        run: npm run test:supabase-migration-layout
      - name: Check Drive page JavaScript syntax
        run: node --check assets/js/pages/clouven-drive.js
      - name: Test ACL and policy
        run: npm run test:clouven-drive-access
      - name: Test API isolation
        run: npm run test:clouven-drive-api
      - name: Test Google Drive folder helper
        run: npm run test:clouven-drive-folder
      - name: Test folder handler guards
        run: npm run test:clouven-drive-folder-handler
      - name: Test upload validation and body limit
        run: npm run test:clouven-drive-upload
      - name: Test Google Drive mutation helper guards
        run: npm run test:clouven-drive-mutations
      - name: Test Google Drive multipart upload helper
        run: npm run test:clouven-drive-google-upload
      - name: Test upload handler
        run: npm run test:clouven-drive-files-handler
      - name: Test download handler
        run: npm run test:clouven-drive-download-handler
      - name: Test item mutation handler
        run: npm run test:clouven-drive-items-handler
      - name: Test trash handler
        run: npm run test:clouven-drive-trash-handler
      - name: Test permissions handler
        run: npm run test:clouven-drive-permissions-handler
      - name: Test external share handler
        run: npm run test:clouven-drive-share-handler
      - name: Test Google Drive sharing helpers
        run: npm run test:clouven-drive-google-sharing
