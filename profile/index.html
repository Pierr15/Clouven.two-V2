  <body>
    <script>
      try {
        if (localStorage.getItem("clouven-sidebar-collapsed") === "1") {
          document.documentElement.classList.add("sidebar-precollapsed");
        }
      } catch {}
    </script>
    <div class="page-noise"></div>
    <aside id="sidebar"></aside>
    <main class="app-main">
      <div class="mobile-topbar">
        <strong>Profil</strong><button class="mobile-menu" type="button" aria-label="Buka menu navigasi" aria-controls="sidebar" aria-expanded="false">☰</button>
      </div>
      <section class="section-pad page-section">

            <h1>Profil <em>kamu.</em></h1>
          </div>
        </header>
        <div id="profileCard"><div class="skeleton"></div></div>
        <article id="nameSettings" hidden></article>
        <div class="grid grid-2" style="margin-top: 18px">
          <article class="card form-card">
            <h3>Ganti Password</h3>
            <form id="passwordForm" style="margin-top: 14px">
              <div class="form-field">
                <label for="field-1">Password baru</label><input
                  name="password"
                  type="password"
                  minlength="6"
                  required
                / id="field-1">
              </div>
              <div class="form-actions">
                <button class="button button-light button-small">
                  Perbarui password
                </button>
              </div>
            </form>
          </article>
          <article class="card form-card">
            <h3>Sesi</h3>
            <p class="muted">Keluar dari akun pada perangkat ini.</p>
            <div class="form-actions">
              <button class="button button-danger" id="logoutBtn">Logout</button
              ><a
                class="button button-dark"
                id="adminShortcut"
                href="/admin/"
                hidden
                >Developer / Admin Console</a
              >
            </div>
          </article>
        </div>
      </section>
